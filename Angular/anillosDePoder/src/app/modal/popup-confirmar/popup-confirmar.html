
        <div class="card flex justify-center gap-2" *ngIf="config">
            <p-toast [life]="3000" [baseZIndex]="11000" />
            <p-confirmdialog [modal]="true" [dismissableMask]="false" [blockScroll]="true" />
            <p-button (click)="confirm2($event)" [label]="config?.message" [outlined]="true" />
            <p-button (click)="confirm2($event)" label="Delete" severity="danger" [outlined]="true" />
        </div>
